name: Test

on:
  push:
  pull_request:

env:
  JAVA_DIST: 'zulu'
  JAVA_VERSION: 22

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Compile and Test with different JVM Flags
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jvm_flag:
          - "-XX:+UseG1GC"
          - "-XX:MaxInlineSize=35"
          - "-XX:+PrintGCDetails"
          - "-XX:+UseStringDeduplication"
          - "-XX:+HeapDumpOnOutOfMemoryError"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DIST }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
      - name: Set JVM Flag
        run: |
          export MAVEN_OPTS="${{ matrix.jvm_flag }}"
          echo "Running with JVM Flag: $MAVEN_OPTS"
      - name: Build and Test with JaCoCo Coverage
        run: |
          xvfb-run mvn -B verify -Djavafx.platform=linux jacoco:report -Pcoverage
      - name: Get JaCoCo Coverage
        id: coverage
        run: |
          coverage=$(python3 config/coverage.py target/site/jacoco/jacoco.csv) 
          echo "COVERAGE=$coverage" >> $GITHUB_ENV
          echo "Coverage for flag ${{ matrix.jvm_flag }}: $coverage%"
      - name: Fail if coverage has not improved
        run: |
          coverage=$COVERAGE
          threshold=13.43
          if (( $(echo "$coverage - $threshold <= 0.1" | bc -l) )); then
            echo "Coverage has not improved for flag ${{ matrix.jvm_flag }}."
            exit 1
          else
            echo "New coverage for flag ${{ matrix.jvm_flag }}: $coverage%"
          fi
      - name: Réponse
        run: echo "Parce qu'il y a trop de bugs🐛!!"